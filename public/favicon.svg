<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Rounded Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Steam Clouds -->
  <circle cx="21" cy="14" r="4" fill="#e2e8f0" opacity="0.8" />
  <circle cx="16" cy="9" r="3" fill="#cbd5e1" opacity="0.6" />
  <circle cx="11" cy="6" r="2" fill="#94a3b8" opacity="0.4" />

  <!-- Chimney / Smokestack -->
  <path d="M21 18 L27 18 L26 26 L22 26 Z" fill="url(#goldGrad)" />

  <!-- Locomotive Cabin (Back) -->
  <rect x="36" y="20" width="18" height="23" rx="3" fill="url(#trainGrad)" />
  <!-- Cabin Roof Curve -->
  <path d="M34 20 Q45 16 56 20" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Cabin Window -->
  <rect x="40" y="24" width="10" height="8" rx="2" fill="#e0f2fe" opacity="0.9" />

  <!-- Locomotive Boiler (Front Body) -->
  <rect x="18" y="25" width="20" height="18" rx="2" fill="url(#trainGrad)" />
  <path d="M18 25 Q13 34 18 43" fill="#1d4ed8" />

  <!-- Front Headlight -->
  <path d="M12 32 L16 30 L16 38 L12 36 Z" fill="url(#goldGrad)" />
  <circle cx="11" cy="34" r="2" fill="#fef08a" />

  <!-- Cowcatcher (Front Grill) -->
  <polygon points="12,43 18,43 15,48 10,48" fill="#64748b" />

  <!-- Base Chassis -->
  <rect x="14" y="42" width="41" height="4" rx="1.5" fill="#475569" />

  <!-- Big Back Wheel -->
  <circle cx="45" cy="49" r="7" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="45" cy="49" r="2.5" fill="#f59e0b" />

  <!-- Middle Wheel -->
  <circle cx="31" cy="51" r="5" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="31" cy="51" r="1.5" fill="#94a3b8" />

  <!-- Front Wheel -->
  <circle cx="19" cy="51" r="5" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="19" cy="51" r="1.5" fill="#94a3b8" />

  <!-- Coupling Rod Connecting Wheels -->
  <line x1="19" y1="51" x2="45" y2="49" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
</svg>